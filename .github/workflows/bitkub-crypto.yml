name: Bitkub Crypto Analysis (Thai)

on:
  schedule:
    - cron: '0 1 * * *' # UTC 01:00 = เวลาไทย 08:00 ทุกวัน (คริปโตซื้อขาย 24/7)
  workflow_dispatch:
    inputs:
      symbols:
        description: 'Bitkub symbols (comma-separated)'
        required: false
        default: 'THB_BTC,THB_ETH,THB_KUB'
      no_llm:
        description: 'technical-only report (skip LLM)'
        required: false
        default: 'false'
      no_telegram:
        description: 'do not send to Telegram'
        required: false
        default: 'false'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: ดึงโค้ด
        uses: actions/checkout@v5

      - name: ตั้งค่า Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ติดตั้ง dependencies
        run: pip install httpx python-dotenv

      - name: รันการวิเคราะห์คริปโต Bitkub
        env:
          BITKUB_SYMBOLS: ${{ vars.BITKUB_SYMBOLS || 'THB_BTC,THB_ETH,THB_KUB' }}
          BITKUB_LLM_BASE_URL: ${{ vars.BITKUB_LLM_BASE_URL || 'https://api.xkiro.com/v1' }}
          BITKUB_LLM_MODEL: ${{ vars.BITKUB_LLM_MODEL || 'cohere/command-a' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY || secrets.LLM_OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          ARGS=(--symbols "${BITKUB_SYMBOLS:-THB_BTC,THB_ETH,THB_KUB}")
          if [[ "${{ inputs.no_llm || 'false' }}" == "true" ]]; then
            ARGS+=(--no-llm)
          fi
          if [[ "${{ inputs.no_telegram || 'false' }}" == "true" ]]; then
            ARGS+=(--no-telegram)
          fi
          python scripts/bitkub_crypto_analyzer.py "${ARGS[@]}"

      - name: อัปโหลดรายงาน
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bitkub-crypto-report
          path: reports/
          retention-days: 7
